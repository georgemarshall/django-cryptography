[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-crypto"
version = "3.1.0"
description = "Easily encrypt data in Django"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Ryan Malloy", email = "ryan@supported.systems"},
]
maintainers = [
    {name = "Ryan Malloy", email = "ryan@supported.systems"},
]
keywords = ["django", "cryptography", "encryption", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2",
    "cryptography>=3.4.4",
    "django-appconf",
    "typing-extensions>=3.7.4.3",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "django-stubs",
    "ruff",
    "coverage[toml]",
    "pytest",
    "pytest-django",
]

[project.urls]
Homepage = "https://github.com/rsp2k/django-crypto"
Repository = "https://github.com/rsp2k/django-crypto"
Issues = "https://github.com/rsp2k/django-crypto/issues"
Documentation = "https://github.com/rsp2k/django-crypto"

# Ruff configuration
[tool.ruff]
target-version = "py39"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "docs",
    ".venv",
    "test_env",
    "test_django_project",
]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "E",   # pycodestyle (Error)
    "ERA", # eradicate
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "S",   # flake8-bandit
    "TCH", # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle (Warning)
]
ignore = [
    "S101", # Allow assert statements in tests
    "S311", # Allow pseudo-random generators
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ERA", "S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["django_crypto"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
ignore_errors = true
omit = ["docs/*", "tests/*"]

# MyPy configuration
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["appconf"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

# UV workspace configuration
[tool.uv]
dev-dependencies = [
    "mypy>=1.0.0",
    "django-stubs>=4.2.0",
    "ruff>=0.1.0",
    "coverage[toml]>=7.0.0",
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
    "tox>=4.0.0",
]